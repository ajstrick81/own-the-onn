name: verify-hashes

# Hardware-free integrity check: re-verify every committed artifact against its
# SHA256SUMS ledger on each push/PR. Firmware blobs intentionally kept out of git
# are listed in the ledgers but skipped here (not failed). See tools/verify_hashes.py.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:  # manual re-run (Actions tab or `gh workflow run verify-hashes.yml --ref main`)

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify SHA256SUMS ledgers
        run: python3 -I tools/verify_hashes.py .
      - name: Verify probe captures (results/ ledger, body hashes, probe staleness)
        run: python3 -I tools/verify_offline.py .
